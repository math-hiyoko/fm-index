[package]
name = "fm-index"
version = "4.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fm_index"
crate-type = ["cdylib"]

[dependencies]
bytemuck = { version = "1.25.2", default-features = false }
memmap2 = { version = "0.9.11", default-features = false }
num-bigint = { version = "0.4.8", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
pyo3 = { version = "0.29.3", default-features = false, features = ["abi3-py311", "abi3t-py315", "macros"] }
rayon = { version = "1.12.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
tempfile = { version = "3.27.0", default-features = false }
